<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fresh Litchi - Fruit Shop</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header role="banner">
      <div class="header-center">
        <a href="index.html" class="logo" aria-label="Go to homepage">
          <img
            src="img/fruit-shop-logo.webp"
            class="logo-img"
            alt="Fruit Shop Logo"
          />
          <span class="products-text" style="text-align: center">
            View Products
          </span>
        </a>
        <nav role="navigation" aria-label="Main navigation">
          <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="bundles.html">Bundles</a>
            <a href="personality-quiz.html" class="quiz-link">🌟 Fruit Quiz</a>
            <a href="subscription.html" class="subscription-link">🍎 Subscription</a>
          </div>
          <a
            href="basket.html"
            class="basket-link"
            aria-label="View shopping basket"
            style="position: relative"
          >
            <img
              src="img/basket-icon.png"
              class="basket-img"
              alt="Shopping basket icon"
            />
            <span class="basket-text">View shopping basket</span>
          </a>
        </nav>
      </div>
    </header>
    <main id="main-content" role="main">
      <div class="content-box" style="text-align: center">
        <div class="litchi-display" role="img" aria-label="Litchi fruit">
          <div style="font-size: 4rem; background: linear-gradient(45deg, #ff6b9d, #ff8fa3); border-radius: 50%; width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; margin: 0 auto; box-shadow: 0 4px 8px rgba(255,107,157,0.3); position: relative;">
            <span style="color: white; font-weight: bold; text-shadow: 1px 1px 2px rgba(0,0,0,0.5);">荔</span>
          </div>
        </div>
        <h1>Litchi</h1>
        <div class="product-desc" aria-label="Product description">
          Sweet, fragrant tropical delight with translucent juicy flesh.
        </div>
        <div style="margin-top: 1.2rem">
          <button
            id="addToBasket"
            class="cart-action-btn"
            aria-label="Add Litchi to basket"
          >
            Add to Basket
          </button>
        </div>
        <div id="factsContainer"></div>
      </div>
    </main>
    <script src="shop.js"></script>
    <script src="fruit-facts.js"></script>
    <script>
      document.getElementById("addToBasket").onclick = function () {
        addToBasket("litchi");
      };
      
      // Add facts section
      document.getElementById("factsContainer").innerHTML = createFactsSection("litchi");
      initFactsCarousel();
    </script>
  </body>
</html>
